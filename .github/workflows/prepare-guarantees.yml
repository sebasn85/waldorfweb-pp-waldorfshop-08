      - name: Build and test client and server bundles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:js
          npm run test:guarantees
      - name: Commit the verified theme to this isolated test branch
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/test/guarantee-components-5.0.86-2026-10-22
          test "$(node -p 'require("./plugin.json").version')" = 5.0.75
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Build Waldorfshop7 5.0.75 guarantee compatibility from live theme baseline'
          git push origin HEAD:"$GITHUB_REF"
