      - name: Build and test all client and SSR bundles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:js
          npm run test:guarantees
      - name: Publish only to the isolated new repository branch
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/test/waldorfshop8-compat-2026-10-22
          test "$(node -p 'require("./plugin.json").name')" = Waldorfshop8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Build isolated Waldorfshop8 5.0.75 with inherited Waldorfshop7 settings'
          git push origin HEAD:"$GITHUB_REF"
